<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #FFCF56; } a:hover { color: #FFE9AE; }
    .step {
      clip-path: polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px),0 6px,6px 6px);
    }
  </style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background-color:#1B1A3B; background-image:repeating-conic-gradient(#1B1A3B 0% 25%, #201F44 0% 50%); background-size:8px 8px; font-family:'Silkscreen', monospace; display:flex; flex-direction:column; box-sizing:border-box; padding:26px 20px 28px; image-rendering:pixelated;">

  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div class="step" style="background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:10px 14px; display:flex; flex-direction:column; gap:6px;">
      <span style="font-family:'Press Start 2P', monospace; font-size:8px; letter-spacing:0.05em; color:#FFCF56;">NIVEAU 07</span>
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:22px; color:#F4EFE6;">1240 PTS</span>
    </div>
    <div class="step" style="background:#A32E42; box-shadow: inset 3px 3px 0 0 #D65C71, inset -3px -3px 0 0 #6E1C2B; display:flex; align-items:center; gap:6px; padding:10px 12px;">
      <svg width="18" height="21" viewBox="0 0 5 7" shape-rendering="crispEdges">
        <rect x="2" y="0" width="1" height="1" fill="#FF97A6"/>
        <rect x="1" y="1" width="3" height="1" fill="#FF97A6"/>
        <rect x="1" y="2" width="3" height="1" fill="#FFD9DF"/>
        <rect x="0" y="3" width="5" height="1" fill="#FFFFFF"/>
        <rect x="0" y="4" width="5" height="1" fill="#FFFFFF"/>
        <rect x="1" y="5" width="3" height="1" fill="#F4EFE6"/>
        <rect x="1" y="6" width="3" height="1" fill="#F4EFE6"/>
      </svg>
      <span style="font-family:'Press Start 2P', monospace; font-size:11px; color:#FFFFFF;">x5</span>
    </div>
  </div>

  <div class="step" style="margin-top:20px; background:#12112A; box-shadow: inset 2px 2px 0 0 #0A0A1C; padding:5px; display:flex; gap:4px;">
    <div style="flex:1; height:16px; background:#FFCF56; box-shadow: inset 2px 2px 0 0 #FFE9AE, inset -2px -2px 0 0 #C99A34;"></div>
    <div style="flex:1; height:16px; background:#FFCF56; box-shadow: inset 2px 2px 0 0 #FFE9AE, inset -2px -2px 0 0 #C99A34;"></div>
    <div style="flex:1; height:16px; background:#FFCF56; box-shadow: inset 2px 2px 0 0 #FFE9AE, inset -2px -2px 0 0 #C99A34;"></div>
    <div style="flex:1; height:16px; background:#FFCF56; box-shadow: inset 2px 2px 0 0 #FFE9AE, inset -2px -2px 0 0 #C99A34;"></div>
    <div style="flex:1; height:16px; background:#2A2852;"></div>
    <div style="flex:1; height:16px; background:#2A2852;"></div>
    <div style="flex:1; height:16px; background:#2A2852;"></div>
    <div style="flex:1; height:16px; background:#2A2852;"></div>
    <div style="flex:1; height:16px; background:#2A2852;"></div>
    <div style="flex:1; height:16px; background:#2A2852;"></div>
  </div>

  <div style="flex:1; display:flex; align-items:center; justify-content:center; margin-top:24px;">
    <div style="display:grid; grid-template-columns:repeat(5, 54px); grid-template-rows:repeat(5, 54px); gap:6px;">

      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>

      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#274B5E; border:3px solid #12262F; box-shadow: inset 3px 3px 0 0 #3A6B82, inset -3px -3px 0 0 #16303C;"></div>
      <div style="background:#274B5E; border:3px solid #12262F; box-shadow: inset 3px 3px 0 0 #3A6B82, inset -3px -3px 0 0 #16303C;"></div>
      <div style="background:#274B5E; border:3px solid #12262F; box-shadow: inset 3px 3px 0 0 #3A6B82, inset -3px -3px 0 0 #16303C;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>

      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#274B5E; border:3px solid #12262F; box-shadow: inset 3px 3px 0 0 #3A6B82, inset -3px -3px 0 0 #16303C;"></div>
      <div style="position:relative; z-index:2; background:#FFCF56; border:3px solid #8C5A14; transform:perspective(300px) rotateY(50deg); box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#274B5E; border:3px solid #12262F; box-shadow: inset 3px 3px 0 0 #3A6B82, inset -3px -3px 0 0 #16303C;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>

      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#274B5E; border:3px solid #12262F; box-shadow: inset 3px 3px 0 0 #3A6B82, inset -3px -3px 0 0 #16303C;"></div>
      <div style="background:#274B5E; border:3px solid #12262F; box-shadow: inset 3px 3px 0 0 #3A6B82, inset -3px -3px 0 0 #16303C;"></div>
      <div style="background:#274B5E; border:3px solid #12262F; box-shadow: inset 3px 3px 0 0 #3A6B82, inset -3px -3px 0 0 #16303C;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>

      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
      <div style="background:#FFCF56; border:3px solid #8C5A14; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34;"></div>
    </div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:18px;">
    <div class="step" style="display:flex; align-items:center; gap:8px; background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:8px 14px;">
      <svg width="18" height="18" viewBox="0 0 6 6" shape-rendering="crispEdges">
        <rect x="2" y="0" width="2" height="1" fill="#FFCF56"/>
        <rect x="1" y="1" width="4" height="1" fill="#FFCF56"/>
        <rect x="0" y="2" width="6" height="1" fill="#FFCF56"/>
        <rect x="0" y="3" width="6" height="1" fill="#FFCF56"/>
        <rect x="1" y="4" width="4" height="1" fill="#FFCF56"/>
        <rect x="2" y="5" width="2" height="1" fill="#FFCF56"/>
        <rect x="1" y="1" width="1" height="1" fill="#FFE9AE"/>
        <rect x="4" y="4" width="1" height="1" fill="#C99A34"/>
      </svg>
      <span style="font-family:'Press Start 2P', monospace; font-size:11px; color:#FFCF56;">320</span>
    </div>
    <div class="step" style="width:42px; height:42px; background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; display:flex; align-items:center; justify-content:center;">
      <svg width="16" height="18" viewBox="0 0 7 8" shape-rendering="crispEdges">
        <rect x="1" y="0" width="2" height="8" fill="#F4EFE6"/>
        <rect x="4" y="0" width="2" height="8" fill="#F4EFE6"/>
      </svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
