<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #FFCF56; } a:hover { color: #FFE9AE; }
    .step {
      clip-path: polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px),0 6px,6px 6px);
    }
    .step-sm {
      clip-path: polygon(3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px),0 3px,3px 3px);
    }
  </style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background-color:#1B1A3B; background-image:repeating-conic-gradient(#1B1A3B 0% 25%, #201F44 0% 50%); background-size:8px 8px; font-family:'Silkscreen', monospace; display:flex; flex-direction:column; align-items:center; box-sizing:border-box; padding:40px 20px 32px;">

  <span style="font-family:'Press Start 2P', monospace; font-size:17px; color:#FF97A6; text-shadow: 3px 3px 0 #6E1C2B; text-align:center; line-height:1.6;">TEMPS<br/>ECOULE !</span>

  <div class="step-sm" style="margin-top:18px; display:flex; align-items:center; gap:8px; background:#FFCF56; box-shadow: inset 2px 2px 0 0 #FFE9AE, inset -2px -2px 0 0 #C99A34; padding:8px 14px;">
    <svg width="14" height="14" viewBox="0 0 5 5" shape-rendering="crispEdges">
      <rect x="2" y="0" width="1" height="1" fill="#4A2E0A"/>
      <rect x="2" y="1" width="1" height="1" fill="#4A2E0A"/>
      <rect x="0" y="2" width="5" height="1" fill="#4A2E0A"/>
      <rect x="2" y="3" width="1" height="1" fill="#4A2E0A"/>
      <rect x="2" y="4" width="1" height="1" fill="#4A2E0A"/>
    </svg>
    <span style="font-family:'Press Start 2P', monospace; font-size:8px; color:#4A2E0A;">NOUVEAU RECORD</span>
  </div>

  <div class="step" style="margin-top:26px; width:100%; background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:22px 22px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px; padding-bottom:16px; border-bottom:2px solid #423C82;">
      <span style="font-family:'Press Start 2P', monospace; font-size:8px; color:#B9AEDD; letter-spacing:0.08em;">SCORE</span>
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:34px; color:#FFCF56;">4820</span>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:12px; color:#B9AEDD;">NIVEAU ATTEINT</span>
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:16px; color:#F4EFE6;">12</span>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:12px; color:#B9AEDD;">MEILLEUR SCORE</span>
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:16px; color:#F4EFE6;">4820</span>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:12px; color:#B9AEDD;">PIECES GAGNEES</span>
      <div style="display:flex; align-items:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 6 6" shape-rendering="crispEdges">
          <rect x="2" y="0" width="2" height="1" fill="#FFCF56"/>
          <rect x="1" y="1" width="4" height="1" fill="#FFCF56"/>
          <rect x="0" y="2" width="6" height="1" fill="#FFCF56"/>
          <rect x="0" y="3" width="6" height="1" fill="#FFCF56"/>
          <rect x="1" y="4" width="4" height="1" fill="#FFCF56"/>
          <rect x="2" y="5" width="2" height="1" fill="#FFCF56"/>
        </svg>
        <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:16px; color:#FFCF56;">+180</span>
      </div>
    </div>
  </div>

  <div style="flex:1;"></div>

  <div style="display:flex; flex-direction:column; gap:14px; width:100%;">
    <div class="step" style="background:#FFCF56; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34; padding:16px 0; text-align:center;">
      <span style="font-family:'Press Start 2P', monospace; font-size:13px; color:#4A2E0A;">REJOUER</span>
    </div>
    <div class="step" style="background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:14px 0; text-align:center;">
      <span style="font-family:'Press Start 2P', monospace; font-size:11px; color:#F4EFE6;">MENU</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
