<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #FFCF56; } a:hover { color: #FFE9AE; }
    .step {
      clip-path: polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px),0 6px,6px 6px);
    }
    .step-sm {
      clip-path: polygon(3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px),0 3px,3px 3px);
    }
  </style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background-color:#1B1A3B; background-image:repeating-conic-gradient(#1B1A3B 0% 25%, #201F44 0% 50%); background-size:8px 8px; font-family:'Silkscreen', monospace; display:flex; flex-direction:column; box-sizing:border-box; padding:26px 20px 28px;">

  <div style="display:flex; align-items:center; gap:14px;">
    <div class="step" style="width:38px; height:38px; background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; display:flex; align-items:center; justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 5 5" shape-rendering="crispEdges">
        <rect x="3" y="0" width="1" height="1" fill="#F4EFE6"/>
        <rect x="2" y="1" width="2" height="1" fill="#F4EFE6"/>
        <rect x="1" y="2" width="2" height="1" fill="#F4EFE6"/>
        <rect x="2" y="3" width="2" height="1" fill="#F4EFE6"/>
        <rect x="3" y="4" width="1" height="1" fill="#F4EFE6"/>
      </svg>
    </div>
    <span style="font-family:'Press Start 2P', monospace; font-size:14px; color:#FFCF56;">PARAMETRES</span>
  </div>

  <div style="display:flex; flex-direction:column; gap:12px; margin-top:26px;">

    <div class="step" style="background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:16px 18px; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:14px; color:#F4EFE6;">MUSIQUE</span>
      <div class="step-sm" style="width:44px; height:22px; background:#12112A; box-shadow: inset 2px 2px 0 0 #0A0A1C; display:flex; align-items:center; padding:3px; justify-content:flex-end;">
        <div class="step-sm" style="width:14px; height:14px; background:#FFCF56; box-shadow: inset 2px 2px 0 0 #FFE9AE, inset -2px -2px 0 0 #C99A34;"></div>
      </div>
    </div>

    <div class="step" style="background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:16px 18px; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:14px; color:#F4EFE6;">SONS</span>
      <div class="step-sm" style="width:44px; height:22px; background:#12112A; box-shadow: inset 2px 2px 0 0 #0A0A1C; display:flex; align-items:center; padding:3px; justify-content:flex-end;">
        <div class="step-sm" style="width:14px; height:14px; background:#FFCF56; box-shadow: inset 2px 2px 0 0 #FFE9AE, inset -2px -2px 0 0 #C99A34;"></div>
      </div>
    </div>

    <div class="step" style="background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:16px 18px; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:14px; color:#F4EFE6;">VIBRATIONS</span>
      <div class="step-sm" style="width:44px; height:22px; background:#12112A; box-shadow: inset 2px 2px 0 0 #0A0A1C; display:flex; align-items:center; padding:3px; justify-content:flex-start;">
        <div class="step-sm" style="width:14px; height:14px; background:#5A5580;"></div>
      </div>
    </div>

    <div class="step" style="background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:16px 18px; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:14px; color:#F4EFE6;">LANGUE</span>
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:13px; color:#B9AEDD;">FRANCAIS &gt;</span>
    </div>

  </div>

  <div style="flex:1;"></div>

  <div class="step" style="background:#A32E42; box-shadow: inset 3px 3px 0 0 #D65C71, inset -3px -3px 0 0 #6E1C2B; padding:15px 0; text-align:center;">
    <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:13px; color:#FFFFFF; letter-spacing:0.04em;">REINITIALISER LA PROGRESSION</span>
  </div>

</div>
</x-dc>
</body>
</html>
