<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #FFCF56; } a:hover { color: #FFE9AE; }
    .step {
      clip-path: polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px),0 6px,6px 6px);
    }
  </style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background-color:#1B1A3B; background-image:repeating-conic-gradient(#1B1A3B 0% 25%, #201F44 0% 50%); background-size:8px 8px; font-family:'Silkscreen', monospace; display:flex; flex-direction:column; box-sizing:border-box; padding:26px 20px 28px;">

  <div style="display:flex; justify-content:flex-end;">
    <div class="step" style="display:flex; align-items:center; gap:8px; background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:8px 14px;">
      <svg width="18" height="18" viewBox="0 0 6 6" shape-rendering="crispEdges">
        <rect x="2" y="0" width="2" height="1" fill="#FFCF56"/>
        <rect x="1" y="1" width="4" height="1" fill="#FFCF56"/>
        <rect x="0" y="2" width="6" height="1" fill="#FFCF56"/>
        <rect x="0" y="3" width="6" height="1" fill="#FFCF56"/>
        <rect x="1" y="4" width="4" height="1" fill="#FFCF56"/>
        <rect x="2" y="5" width="2" height="1" fill="#FFCF56"/>
        <rect x="1" y="1" width="1" height="1" fill="#FFE9AE"/>
        <rect x="4" y="4" width="1" height="1" fill="#C99A34"/>
      </svg>
      <span style="font-family:'Press Start 2P', monospace; font-size:11px; color:#FFCF56;">640</span>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
      <span style="font-family:'Press Start 2P', monospace; font-size:29px; color:#FFCF56; text-shadow: 4px 4px 0 #8C5A14, 8px 8px 0 #12112A; letter-spacing:1px;">GRITSWAP</span>
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:13px; color:#B9AEDD; letter-spacing:0.12em;">RETOURNE. MATCHE. SURVIS.</span>
    </div>

    <div style="display:flex; flex-direction:column; gap:16px; width:100%;">
      <div class="step" style="background:#FFCF56; box-shadow: inset 3px 3px 0 0 #FFE9AE, inset -3px -3px 0 0 #C99A34; padding:18px 0; text-align:center;">
        <span style="font-family:'Press Start 2P', monospace; font-size:15px; color:#4A2E0A;">JOUER</span>
      </div>
      <div class="step" style="background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:16px 0; text-align:center;">
        <span style="font-family:'Press Start 2P', monospace; font-size:13px; color:#F4EFE6;">BOUTIQUE</span>
      </div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:12px;">
    <div class="step" style="background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; padding:14px 18px; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-family:'Press Start 2P', monospace; font-size:8px; color:#B9AEDD; letter-spacing:0.05em;">MEILLEUR SCORE</span>
      <span style="font-family:'Silkscreen', monospace; font-weight:700; font-size:18px; color:#F4EFE6;">4820</span>
    </div>
    <div style="display:flex; justify-content:center;">
      <div class="step" style="width:42px; height:42px; background:#2E2A5E; box-shadow: inset 3px 3px 0 0 #423C82, inset -3px -3px 0 0 #1C1938; display:flex; align-items:center; justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 7 7" shape-rendering="crispEdges">
          <rect x="3" y="0" width="1" height="2" fill="#F4EFE6"/>
          <rect x="3" y="5" width="1" height="2" fill="#F4EFE6"/>
          <rect x="0" y="3" width="2" height="1" fill="#F4EFE6"/>
          <rect x="5" y="3" width="2" height="1" fill="#F4EFE6"/>
          <rect x="2" y="2" width="3" height="3" fill="#F4EFE6"/>
          <rect x="3" y="3" width="1" height="1" fill="#2E2A5E"/>
        </svg>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
